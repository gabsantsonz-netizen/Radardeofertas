<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#121212;font-family:"Inter Display","Inter",sans-serif;color:#fff;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 52%,rgba(255,221,0,.16),transparent 70%)}
.top{position:absolute;top:150px;left:0;right:0;text-align:center}
.tag{display:inline-block;background:#FFE000;color:#111;font-weight:900;font-size:58px;padding:10px 28px;letter-spacing:-1px}
h1{font-weight:900;font-size:132px;line-height:.92;letter-spacing:-5px;margin-top:34px;text-transform:uppercase}
h1 span{color:#FFE000}
.photo{position:absolute;top:770px;left:0;width:1080px;height:600px;background:url(foto.jpg) center/cover;
 -webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.stats{position:absolute;top:1430px;left:70px;right:70px;display:flex;gap:30px}
.stat{flex:1;border:4px solid #FFE000;border-radius:28px;padding:30px 20px;text-align:center;background:rgba(0,0,0,.55)}
.n{font-weight:900;font-size:140px;line-height:1;color:#FFE000;letter-spacing:-6px}
.l{font-weight:800;font-size:46px;margin-top:10px;text-transform:uppercase}
.bar{position:absolute;bottom:0;left:0;right:0;height:22px;background:#FFE000}
</style></head><!-- Template de thumbnail 1080x1920. Troque foto.jpg, o texto da tag, o título e os 2 números. -->
<body><div class="glow"></div>
<div class="top"><div class="tag">CREME DE AVELÃ COM</div><h1>Metade<br>das <span>calorias</span></h1></div>
<div class="photo"></div>
<div class="stats"><div class="stat"><div class="n">-50%</div><div class="l">calorias</div></div><div class="stat"><div class="n">0g</div><div class="l">de açúcar</div></div></div>
<div class="bar"></div></body></html>
